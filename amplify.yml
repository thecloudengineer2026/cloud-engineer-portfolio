version: 1

frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm ci
        - npm audit --omit=dev --audit-level=high
    build:
      commands:
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - "**/*"

  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*